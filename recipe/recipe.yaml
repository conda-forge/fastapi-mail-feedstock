context:
  version: "1.6.5"

package:
  name: fastapi-mail
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastapi-mail/fastapi_mail-${{ version }}.tar.gz
  sha256: 458d8d185ae27d2e5936dd58c6fb8667d4a413fd6aae32fac2f32014794da5d6

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=2.0
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - starlette >=1.0.0,<2.0.0
    - pydantic-settings >=2.6.1,<3.0.0
    - cryptography >=47.0.0,<48.0.0
    - httpx >=0.28.1
    - typing-extensions >=4.15.0
    - jinja2 >=3.1.6
    - pydantic >=2.12.5
    - email-validator >=2.3.0
    - regex >=2025.11.3
    - aiosmtplib >=5.0.0
    - blinker >=1.9.0
  run_constraints:
    - redis-py >=7.4.0,<8.0.0

tests:
  - python:
      imports:
        - fastapi_mail
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Simple lightweight mail library for FastApi
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/sabuhish/fastapi-mail

extra:
  recipe-maintainers:
    - synapticarbors
